[package]
name = "uv-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The command layer, shared by the `uv` CLI and the iOS app so both obey the same disciplines."

[dependencies]
uv-air = { path = "../air" }
uv-kernel2 = { path = "../kernel2" }
uv-wallet2 = { path = "../wallet2" }
uv-envelope = { path = "../envelope" }
uv-btc = { path = "../btc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
bincode = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"

[dev-dependencies]
p3-baby-bear = "0.4.3"
p3-field = "0.4.3"
