[package]
name = "uv-wallet2"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Ultraviolet's v2 wallet core: the disciplines the formal models proved necessary."

# The consensus-critical wallet logic only: keys, the note store, the sign-log
# replay discipline (onetime.qnt), the full-lineage receive path (linkage.qnt,
# multihop.qnt), and reorg reconciliation (reorg.qnt). Transport (Signal), CLI,
# and the Bitcoin chain backend wire in above this crate.
[dependencies]
uv-air = { path = "../air" }
uv-kernel2 = { path = "../kernel2" }
p3-baby-bear = "0.4.3"
p3-field = "0.4.3"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
serde_json = "1"

# For the forged-lineage regression test, which hand-builds a malicious trace.
[dev-dependencies]
p3-uni-stark = "0.4.3"
p3-matrix = "0.4.3"
p3-poseidon2-air = "0.4.3"
