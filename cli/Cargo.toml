[package]
name = "uv-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Ultraviolet CLI wallet: issue / send / scan / balance on the sovereign STARK."

[[bin]]
name = "uv"
path = "src/main.rs"

[dependencies]
uv-air = { path = "../air" }
uv-kernel2 = { path = "../kernel2" }
uv-wallet2 = { path = "../wallet2" }
uv-btc = { path = "../btc" }
uv-envelope = { path = "../envelope" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The relay client. Already in the lockfile via bitcoincore-rpc -> jsonrpc,
# so this adds nothing to the dependency closure.
minreq = "2"
bincode = "1.3"
hex = "0.4"
zeroize = "1"
# At-rest encryption of the wallet file. Off the money path by construction —
# a break here exposes a local file to someone who already has your disk, and
# the "hashes only" rule governs consensus, not disk encryption.
chacha20poly1305 = "0.10"
argon2 = "0.5"
rpassword = "7"
# For the reservation filename only — see `addr_id` in main.rs. Not on the
# money path: consensus hashes field elements through the sponge, never bytes
# (spec/99 [NO-BYTE-IDENTITY]). Already in the lockfile via `uv-envelope`, so
# this adds nothing to the dependency closure.
sha2 = "0.10"
# Advisory OS locks serialize wallet and address-reservation read/modify/write
# transactions across independent `uv` processes. A process-local mutex cannot
# protect a one-time signing key from two CLI invocations.
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"
