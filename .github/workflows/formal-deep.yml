name: deep formal verification

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pinned Quint
        run: npm install -g @informalsystems/quint@0.32.0
      - name: Record tool and source identity
        run: |
          quint --version
          git rev-parse HEAD
      - name: Run complete matrix
        run: |
          set -o pipefail
          ./formal/verify.sh | tee formal-verification.log
      - name: Preserve verification transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-verification-${{ github.sha }}
          path: formal-verification.log
