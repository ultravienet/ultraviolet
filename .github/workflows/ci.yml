name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # One job for the whole workspace. There is no second toolchain any more: the
  # sovereign STARK builds with plain stable Rust, so the zkVM job (sp1up, the
  # RISC-V guest ELF) is gone along with the crates that needed it.
  build:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # protoc is back, for a different reason than it left. `uv-signal` depends
      # on Signal's own libsignal, whose post-quantum ratchet compiles protobuf
      # definitions in a build script. Nothing on the money path needs it.
      - name: Install protoc (libsignal build scripts)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - name: Install Rust (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install stable
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      # The end-to-end payment flow, on the file-backed chain: issuance, a
      # two-hop lineage validated in full, the confirmation policy, a
      # double-spend attempt that the sign-log replays instead of signing, and
      # reorg reconciliation. The script self-checks the replayed nullifier.
      - name: End-to-end demo
        run: ./demo/local2.sh
      # Two homes and a real socket. A GitHub runner has no second machine, but
      # it does have loopback, and loopback is enough to prove the payer and
      # payee share no filesystem: the relay carries the bundle, the cursor
      # stops it being re-fetched, and a dead relay costs delivery rather than
      # money. `demo/two-machines.md` is this script with the address changed.
      - name: A payment over a network
        run: |
          cargo build --release -p uv-cli
          ./demo/relay.sh

  # The reorg fix, against a real node. Everything about it is unit-tested --
  # detection, rollback, the fail-open traps -- but a unit test cannot tell you
  # that Core's behaviour is what the code assumes. This harness already caught
  # one real bug that no unit test would have (the fix was inert against the
  # real backend because `refresh()` was never called), which is the argument
  # for paying the four minutes to keep it running.
  #
  # Its own job: it needs a bitcoind download and a release build, and neither
  # should hold up the fast feedback from fmt/clippy/tests.
  regtest:
    name: reorgs against a real bitcoind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Not in Ubuntu's repositories, and the PPA is a third party. The release
      # tarball is signed by the Bitcoin Core maintainers and pinned by version
      # here; upgrading it is a deliberate edit.
      - name: Install bitcoind
        run: |
          set -euo pipefail
          VER=27.1
          URL="https://bitcoincore.org/bin/bitcoin-core-$VER/bitcoin-$VER-x86_64-linux-gnu.tar.gz"
          curl -fsSL -o /tmp/bitcoin.tar.gz "$URL"
          tar -xzf /tmp/bitcoin.tar.gz -C /tmp
          sudo install -m 0755 "/tmp/bitcoin-$VER/bin/bitcoind" /usr/local/bin/bitcoind
          sudo install -m 0755 "/tmp/bitcoin-$VER/bin/bitcoin-cli" /usr/local/bin/bitcoin-cli
          bitcoind --version | head -1
      - name: Install protoc (libsignal build scripts)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - name: Install Rust (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install stable
      - uses: Swatinem/rust-cache@v2
      # The harness runs the release binary: a debug proof takes ~11 s on a
      # runner and this script proves several.
      - run: cargo build --release -p uv-cli
      # `bitcoind` on PATH is what makes this run rather than skip. If the
      # install step above ever silently fails, the script exits 0 with "SKIP"
      # and the job goes green having tested nothing -- so check first.
      - name: Refuse to pass by skipping
        run: command -v bitcoind
      - name: Reorgs, on a real node
        run: ./demo/regtest.sh

  # The formal models' *rot* checks, not their verification.
  #
  # Verification is manual and stays manual (formal/verify.sh, logged in
  # formal/VERIFIED.md): the deep runs are too slow for a push — channels'
  # `naiveSettle` took ~45 minutes at depth 5 and depth 6 never converged.
  #
  # What runs here is the failure that actually happened: after two crate
  # renames and the zkVM removal, formal/ cited eight source paths that were
  # gone, including the test named twice as the real-code replay of the
  # inflation attack. Nothing turned red, and the models kept being quoted as
  # evidence. These two checks take seconds and would have caught it.
  formal:
    name: formal models (typecheck + references)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Pinned: the models were developed and verified against this version,
      # and an unpinned verifier is the [DEPS] problem wearing a different coat.
      - name: Install Quint 0.32.0
        run: npm install -g @informalsystems/quint@0.32.0
      - name: Typecheck every model
        run: |
          set -euo pipefail
          for m in formal/*.qnt; do
            echo "== $m"
            quint typecheck "$m"
          done
      - name: Every cited source path exists
        run: ./formal/check-refs.sh

  audit-deps:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Fatal: an advisory with a CVE against something we ship.
      - name: Vulnerabilities
        run: cargo audit
      # Not fatal, but it must stay visible: unmaintained/unsound/yanked crates.
      # Known at time of writing: bincode 1.3 unmaintained and still a direct
      # dependency on the money path's serialization (spec/99 [DEPS]).
      - name: Informational advisories (unmaintained, unsound, yanked)
        continue-on-error: true
        run: cargo audit --deny warnings
