[package]
name = "uv-air"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Ultraviolet's sovereign STARK: WOTS+ over Poseidon2 and the AIR that verifies it."

# Upstream Plonky3, plain 0.4.3 — deliberately not the `0.4.3-succinct` fork a
# zkVM would pin (the two trees cannot mix). This crate replaced the zkVM on
# the money path; nothing in the workspace depends on one any more.
[dependencies]
p3-baby-bear = "0.4.3"
p3-field = "0.4.3"
p3-air = "0.4.3"
p3-challenger = "0.4.3"
p3-commit = "0.4.3"
p3-dft = "0.4.3"
p3-fri = "0.4.3"
p3-keccak = "0.4.3"
p3-merkle-tree = "0.4.3"
p3-matrix = "0.4.3"
p3-poseidon2 = "0.4.3"
p3-poseidon2-air = "0.4.3"
p3-symmetric = "0.4.3"
p3-uni-stark = "0.4.3"
rand = { version = "0.9", features = ["std", "std_rng", "os_rng", "small_rng"] }
bincode = "1.3"
serde = "1"
