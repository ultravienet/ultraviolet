[package]
name = "uv-kernel2"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Ultraviolet's money path on Poseidon2: per-note keys, notes, nullifiers, transfers, records."

# The kernel. Field-native (BabyBear) so the same values flow through the
# sovereign STARK without re-encoding: one hash (Poseidon2), no sha2, no
# SLH-DSA, no patched dependencies. The SHA-256/SLH-DSA/zkVM stack it replaced
# was deleted once nothing imported it.
[dependencies]
uv-air = { path = "../air" }
p3-baby-bear = "0.4.3"
p3-field = "0.4.3"
p3-symmetric = "0.4.3"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
bincode = "1.3"
serde_json = "1"

# `cfg(kani)` guards the proof harnesses (see amount.rs/digest.rs/issuance.rs);
# only `cargo kani` ever sets it, and rustc must not warn about it meanwhile.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
